<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Hero Wars: TapTap! - Epic Tap Adventure</title>
    <meta name="title" content="Hero Wars: TapTap! - Epic Tap Adventure">
    <meta name="description" content="Join the epic battle in Hero Wars: TapTap! Tap as fast as you can, collect coins, upgrade your hero, and master powerful skills. Compete against time and maximize your score in this thrilling tap adventure game!">
    <meta name="keywords" content="Hero Wars, TapTap, tap game, adventure game, hero wars game, idle game, tap adventure">
    <meta name="author" content="Hero Wars">
    <meta name="theme-color" content="#2a2a2a">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ternome.github.io/hwa-playable/">
    <meta property="og:title" content="Hero Wars: TapTap! - Epic Tap Adventure">
    <meta property="og:description" content="Join the epic battle in Hero Wars: TapTap! Tap as fast as you can, collect coins, upgrade your hero, and master powerful skills. Compete against time and maximize your score!">
    <meta property="og:image" content="https://ternome.github.io/hwa-playable/assets/ogimage.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Hero Wars: TapTap!">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://ternome.github.io/hwa-playable/">
    <meta property="twitter:title" content="Hero Wars: TapTap! - Epic Tap Adventure">
    <meta property="twitter:description" content="Join the epic battle in Hero Wars: TapTap! Tap as fast as you can, collect coins, upgrade your hero, and master powerful skills. Compete against time and maximize your score!">
    <meta property="twitter:image" content="https://ternome.github.io/hwa-playable/assets/ogimage.png">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="assets/appicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hero Wars: TapTap!">
    <!-- Spine Animation Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-spine@3.0.20/dist/pixi-spine.umd.js"></script>
</head>
<body>
    <div id="center-countdown" class="center-countdown"></div>
    
    <!-- Onboarding Hand Animation -->
    <div id="onboarding-hand" class="onboarding-hand hidden"></div>
    
    <!-- Success Screen -->
    <div id="success-screen" class="success-screen hidden">
        <div class="success-content">
            <!-- Try again button -->
            <button id="try-again-button" class="try-again-button">
                <span class="try-again-icon">↻</span>
                <span class="try-again-text">Try again</span>
            </button>
            
            <!-- YOU WON section -->
            <div class="won-section">
                <div class="won-header">
                    <span class="won-trophy-icon">🏆</span>
                    <h2 class="won-title">YOU WON</h2>
                </div>
                <div class="won-coins">
                    <img class="won-coin-icon" src="assets/coin.png" alt="Coin" />
                    <span id="won-coins-amount" class="won-coins-amount">0</span>
                    <div class="won-coins-value">~<span id="won-coins-dollar">0</span>$</div>
                </div>
                <div class="won-taps">
                    <span class="won-taps-label">Taps:</span>
                    <span id="won-taps-count" class="won-taps-count">0</span>
                </div>
            </div>
            
            <!-- Treasure chest image -->
            <div class="treasure-chest-container">
                <img class="treasure-chest-image" src="assets/chest.png" alt="Treasure Chest" />
            </div>
            
            <!-- Bonus Prize section -->
            <div class="bonus-section">
                <div class="bonus-badge">Bonus Prize</div>
                <div class="bonus-text">
                    You're better than <span id="bonus-percent-text">17</span>% of players.
                </div>
                <div class="character-avatar">
                    <img id="success-character-img" class="avatar-image" src="assets/bonus-prize.png" alt="Bonus Prize" />
                </div>
            </div>
            
            <!-- Claim button -->
            <button id="claim-button" class="claim-button">CLAIM ALL REWARDS IN GAME</button>
            
            <!-- Logo -->
            <div class="success-logo">HERO WARS ALLIANCE</div>
        </div>
    </div>
    
    <div class="game-container">
        <!-- Top Section -->
        <div class="top-section">
            <div class="stats-bar">
                <div class="trophy-text">
                    <span class="trophy-icon">🏆</span>
                    <span id="percent-text">You're better than 17% of players</span>
                </div>
            </div>
            
            <div class="level-container">
                <div class="progress-bar">
                    <div class="level-label">Level <span id="current-level">1</span></div>
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            
            <div class="currency-container">
                <div class="currency-display">
                    <img class="coin-icon" src="assets/coin.png" alt="Coin" />
                    <span id="coins-display">0</span>
                </div>
                <div class="income-stats">
                    <div class="income-item">
                        <span>+<span id="coins-per-tap">1</span> <span class="income-suffix">per tap</span></span>
                    </div>
                    <div class="income-item">
                        <span>+<span id="coins-per-sec">0</span> <span class="income-suffix">per sec</span></span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Middle Section - Character -->
        <div class="middle-section">
            <div class="character-container">
                <img class="pedestal" src="assets/pedestal.png" alt="Pedestal" />
                <div class="character" id="character">
                    <img id="character-img" class="character-body" src="assets/HeroState_1.png" alt="Hero Level 1" />
                </div>
            </div>
        </div>
        
        <!-- Bottom Section - Skills -->
        <div class="bottom-section">
            <div class="timer-container">
                <span id="timer-text"><span class="timer-label">Time left:</span> <span id="timer-value">60</span>s</span>
            </div>
            <div class="skills-grid">
                <div class="skill-card" data-skill="tap">
                    <div class="skill-info">
                        <div class="skill-title">Battle Spirit</div>
                        <div class="skill-effect">
                            <img class="coin-icon-small" src="assets/coin.png" alt="Coin" />
                            <span>×<span class="skill-value">2</span> per tap</span>
                        </div>
                        <div class="cooldown-text"></div>
                        <div class="ready-button">READY</div>
                    </div>
                </div>
                
                <div class="skill-card" data-skill="passive">
                    <div class="skill-info">
                        <div class="skill-title">Hero's Focus</div>
                        <div class="skill-effect">
                            <img class="coin-icon-small" src="assets/coin.png" alt="Coin" />
                            <span>+<span class="skill-value">10</span> per sec</span>
                        </div>
                        <div class="cooldown-text"></div>
                        <div class="ready-button">READY</div>
                    </div>
                </div>
                
                <div class="skill-card" data-skill="time1">
                    <div class="skill-info">
                        <div class="skill-title">Heroic Delay</div>
                        <div class="skill-effect">
                            <span>+<span class="skill-value">10</span> sec</span>
                        </div>
                        <div class="cooldown-text"></div>
                        <div class="ready-button">READY</div>
                    </div>
                </div>
                
                <div class="skill-card" data-skill="crowdboost">
                    <div class="skill-info">
                        <div class="skill-title">Crowd Boost</div>
                        <div class="skill-effect">
                            <span>×3 income 5s</span>
                        </div>
                        <div class="cooldown-text"></div>
                        <div class="ready-button">READY</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => {
                        console.log('Service Worker registered');
                        // Проверять обновления каждые 60 секунд
                        setInterval(() => {
                            reg.update();
                        }, 60000);
                    })
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>
</html>
